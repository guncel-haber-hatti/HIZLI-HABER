<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENGİN SAVCU | CV</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; color: #333; }
        .kurlar { background: #111; color: #fff; display: flex; justify-content: center; gap: 20px; padding: 5px; font-size: 11px; font-weight: bold; }
        .kurlar span { color: #0f0; }
        header { background: #fff; text-align: center; padding: 15px; border-bottom: 2px solid #ddd; sticky; top: 0; z-index: 9; }
        .logo { font-size: 28px; font-weight: 900; background: linear-gradient(135deg, #707070, #e0e0e0, #707070); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .search { display: flex; max-width: 400px; margin: 10px auto; }
        .search input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px 0 0 4px; }
        .search button { padding: 8px; background: #333; color: #fff; border: none; border-radius: 0 4px 4px 0; cursor: pointer; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .card { background: #fff; display: flex; cursor: pointer; border-radius: 5px; overflow: hidden; border: 1px solid #ddd; }
        .card img { width: 200px; object-fit: cover; }
        .card-body { padding: 15px; }
        .tag { color: red; font-size: 10px; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; overflow-y: auto; z-index: 99; }
        .m-cont { max-width: 700px; margin: auto; padding: 40px 20px; }
        .close { position: fixed; right: 20px; top: 10px; font-size: 40px; cursor: pointer; }
        .btns { display: flex; gap: 10px; margin-bottom: 20px; }
        .i { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
        .y { background: #f00; }
        .btn { color: #fff; padding: 10px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 12px; }
        iframe { width: 100%; height: 400px; margin-top: 20px; border-top: 2px solid #eee; padding-top: 10px; }
        @media (max-width: 600px) { .card { flex-direction: column; } .card img { width: 100%; } }
    </style>
</head>
<body>
    <div class="kurlar">USD <span>34.25</span> EUR <span>37.18</span> ALTIN <span>2.948</span> BIST <span>9.280</span></div>
    <header>
        <div class="logo">ENGİN SAVCU CV</div>
        <div class="search"><input type="text" placeholder="Haber ara..."><button>ARA</button></div>
    </header>
    <div class="container">
        <div class="card" onclick="openM()">
            <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=400">
            <div class="card-body">
                <span class="tag">ÖZEL HABER</span>
                <h3>Engin Savcu: Enez’den Yükselen Başarı Hikayesi</h3>
                <p style="font-size:13px; color:#666;">Kariyer yolculuğu, sanat hayatı ve profesyonel tecrübeleri...</p>
            </div>
        </div>
    </div>
    <div id="m" class="modal">
        <div class="m-cont">
            <span class="close" onclick="closeM()">&times;</span>
            <div class="btns"><a href="#" class="btn i">INSTAGRAM</a><a href="#" class="btn y">YOUTUBE</a></div>
            <h1 id="mt"></h1><hr>
            <div id="mb" style="font-size:17px; line-height:1.6;"></div>
            <iframe id="vf" src="https://www.youtube.com/embed/h9KWuunILxg?enablejsapi=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>
    <script>
        function openM() {
            document.getElementById('vf').contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            document.getElementById('mt').innerText = "Engin Savcu: Kariyer ve Sanatın Buluştuğu Nokta";
            document.getElementById('mb').innerHTML = `
                <p><b>EDİRNE / ENEZ</b> – Bugün 25 yaşında olan <b>Engin Savcu</b>, iş hayatına erken yaşta adım atmış çok yönlü bir isimdir.</p>
                <p><b>Resepsiyon ve Otelcilik:</b> <b>Luu Otel</b> Resepsiyon Şefliği ve <b>Kapaklı Apart</b> idari sorumluluğu ile uzmanlaşmıştır.</p>
                <p><b>Hizmet ve Şeflik:</b> <b>Hangover</b>’da salon şefliği yapmış; ekibine servis inceliklerinden <b>şampanya açmasına</b> kadar her şeyi öğretmiştir.</p>
                <p><b>Dijital:</b> <b>Trend Aqua Park</b> bünyesinde dijital kimlik yönetimi yapmıştır.</p>
                <p><b>Sanat:</b> 10 yıldır kesintisiz <b>söz ve beste yazarlığı</b> yapmaktadır.</p>
                <p>Jeofizik işçiliği, arkeolojik kazılar ve siyasi fotoğrafçılık tecrübeleri bulunmaktadır.</p>`;
            document.getElementById('m').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        function closeM() {
            document.getElementById('m').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('vf').contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        }
    </script>
</body>
</html>
