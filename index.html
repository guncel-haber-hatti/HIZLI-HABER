<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SON DAKİKA | SKANDAL HABER</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --danger-red: #b91c1c; --bg-light: #fef2f2; --text-dark: #111827; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-light); color: var(--text-dark); line-height: 1.6; }

        /* SKANDAL HEADER */
        .hero { 
            height: 40vh; 
            background: linear-gradient(rgba(185, 28, 28, 0.9), rgba(0, 0, 0, 1)), 
                        url('https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?auto=format&fit=crop&w=1920'); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            border-bottom: 8px solid #000;
        }
        .main-logo { font-family: 'Playfair Display', serif; font-size: clamp(30px, 6vw, 70px); font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; }
        .main-logo span { background: #fff; color: #b91c1c; padding: 0 10px; margin-left: 10px; }
        .sub-tagline { font-size: 14px; letter-spacing: 5px; color: #fff; margin-top: 15px; font-weight: 800; background: #b91c1c; padding: 5px 20px; }

        nav { background: #000; padding: 15px 0; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid #b91c1c; }
        .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: center; align-items: center; }
        .live-tag { color: #fff; font-weight: 900; animation: blink 0.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

        .main-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .news-card { background: #fff; border: 2px solid #e5e7eb; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .news-card:hover { border-color: #b91c1c; transform: scale(1.02); }
        .card-data { padding: 15px; }
        .card-h { font-size: 16px; font-weight: 800; line-height: 1.3; }

        /* MODAL */
        #articleModal { display: none; position: fixed; inset: 0; background: #fff; z-index: 2000; overflow-y: auto; }
        .close-modal { position: fixed; top: 15px; right: 20px; font-size: 50px; cursor: pointer; color: #b91c1c; z-index: 3000; }
        .modal-body { max-width: 700px; margin: 60px auto; padding: 0 20px; }
        
        .art-title { font-size: 32px; color: #b91c1c; margin-bottom: 25px; text-align: center; font-weight: 900; line-height: 1.1; border-bottom: 4px double #b91c1c; padding-bottom: 15px; }
        .art-content { font-size: 19px; color: #1f2937; font-weight: 500; }
        
        .scandal-box { 
            background: #000; color: #fff; border-radius: 0; padding: 25px; margin: 30px 0; text-align: center; border: 4px solid #b91c1c;
        }
        .scandal-number { font-size: 35px; font-weight: 900; color: #fff; display: block; margin-top: 10px; letter-spacing: 3px; }

        footer { padding: 30px 0; text-align: center; background: #000; color: #fff; font-size: 10px; margin-top: 50px; }
    </style>
</head>
<body>

<div class="hero">
    <div class="main-logo">SKANDAL<span>HABER</span></div>
    <div class="sub-tagline">KAPAKLI ÖZEL DOSYA | AHLAK ÇÖKÜŞÜ</div>
</div>

<nav>
    <div class="nav-inner"><div class="live-tag">FLAŞ... FLAŞ... FLAŞ...</div></div>
</nav>

<div class="main-container">
    <div class="grid" id="newsGrid"></div>
</div>

<div id="articleModal">
    <span class="close-modal" onclick="closeArticle()">&times;</span>
    <div class="modal-body" id="modalContent"></div>
</div>

<footer>&copy; 2026 SKANDAL HABER MERKEZİ | GERÇEKLER GİZLİ KALMAZ</footer>

<script>
    const database = [];

    const scandalStory = {
        id: "SCANDAL-AHMET-01",
        tag: "KAPAKLI / SKANDAL",
        h: "Kapaklı'da Ahlak Sınırları Zorlanıyor! Ahmet Çetin Hakkındaki O İddialar Şok Etti!",
        img: "https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?auto=format&fit=crop&w=800",
        body: `
            <h1 class="art-title">PES DEDİRTEN SKANDAL: AHMET ÇETİN'İN UTANÇ VEREN DÜŞÜŞÜ!</h1>
            <div class="art-content">
                <p>Kapaklı bugünlerde ağızları açık bırakan bir ahlak skandalıyla çalkalanıyor! Toplumun değer yargılarını hiçe sayan <b>Ahmet Çetin</b>, sergilediği yaşam tarzıyla "bu kadarına da pes" dedirtti! Kapaklı’nın mahalle aralarında yayılan bu skandalın başrolündeki isim, adeta bir pazarlık objesi haline gelmiş durumda!</p>

                <p>Halkın "utanç kaynağı" olarak nitelediği bu durum, Kapaklı’nın sosyal dokusunda derin bir yara açtı! Eskiden teknik başarılarıyla anılan ismin, nasıl bu kadar alçaldığı ise merak konusu.</p>
                
                <div class="scandal-box">
                    <b style="color: #b91c1c; font-size: 20px;">İŞTE O SKANDAL HAT:</b>
                    <span class="scandal-number">0536 718 19 63</span>
                    <small style="color:#9ca3af; display:block; margin-top:10px;">(Kapaklı'da Herkes Bu Numarayı Konuşuyor!)</small>
                </div>

                <p><b>Kapaklı Sokakları Tepkili:</b><br>
                Sosyal medya mecralarında skandal paylaşımların altına eklenen o numara, Ahmet Çetin’in bu utanç dolu 'düşüşünün' belgesi niteliğinde! Halk adaletin ve toplumsal ahlakın bu derece ayaklar altına alınmasına isyan ediyor!</p>
            </div>`
    };

    const gundemBase = [
        { t: "KAPAKLI", h: "Sanayi Bölgesinde Hareketlilik Sürüyor", d: "Ekonomik veriler paylaşıldı." },
        { t: "ASAYİŞ", h: "Ekipler Gece Mesaisinde", d: "Güvenlik önlemleri artırıldı." }
    ];

    for(let i=1; i<=46; i++) {
        if(i === 1) { database.push(scandalStory); }
        else {
            const p = gundemBase[i % gundemBase.length];
            database.push({
                id: i, tag: p.t, h: `${p.h} #${i}`, img: `https://picsum.photos/seed/${i+5}/600/400`,
                body: `<h1 class="art-title">${p.h}</h1><div class="art-content"><p>${p.d}</p></div>`
            });
        }
    }

    const grid = document.getElementById('newsGrid');
    function draw(list) {
        grid.innerHTML = '';
        list.forEach(item => {
            grid.innerHTML += `
                <div class="news-card" onclick="openArticle('${item.id}')">
                    <img src="${item.img}" style="width:100%; height:180px; object-fit:cover;">
                    <div class="card-data">
                        <span style="color:#b91c1c; font-weight:800; font-size:10px;">${item.tag}</span>
                        <h2 class="card-h">${item.h}</h2>
                    </div>
                </div>`;
        });
    }

    function openArticle(id) {
        const n = database.find(x => x.id == id);
        document.getElementById('modalContent').innerHTML = n.body;
        document.getElementById('articleModal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeArticle() {
        document.getElementById('articleModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    draw(database);
</script>
</body>
</html>
