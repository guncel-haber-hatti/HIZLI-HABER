<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GÜNCEL HABER | Özel Dosya: Ahmet Çetin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #d4af37; --bg-bright: #f8fafc; --card-bright: #ffffff; 
            --text-dark: #0f172a; --text-muted: #475569; --danger: #991b1b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-bright); color: var(--text-dark); line-height: 1.7; }

        .hero { 
            height: 45vh; 
            background: linear-gradient(rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 1)), 
                        url('https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1920'); 
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            border-bottom: 5px solid var(--danger);
        }
        .main-logo { font-family: 'Playfair Display', serif; font-size: clamp(28px, 5vw, 60px); font-weight: 900; color: #fff; letter-spacing: 5px; text-transform: uppercase; }
        .main-logo span { color: var(--danger); }
        .sub-tagline { font-size: 10px; letter-spacing: 5px; color: var(--gold); margin-top: 12px; font-weight: 800; text-transform: uppercase; }

        nav { background: #ffffff; padding: 15px 0; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #e2e8f0; }
        .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .live-tag { color: var(--danger); font-weight: 900; font-size: 12px; letter-spacing: 2px; display: flex; align-items: center; }
        .live-tag::before { content: ''; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; margin-right: 8px; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .main-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        
        .news-card { background: var(--card-bright); border-radius: 8px; border: 1px solid #e2e8f0; transition: 0.3s; cursor: pointer; overflow: hidden; }
        .news-card:hover { transform: translateY(-5px); border-color: var(--danger); }
        .card-data { padding: 20px; }
        .card-cat { color: var(--danger); font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .card-h { font-family: 'Playfair Display', serif; font-size: 18px; line-height: 1.4; color: var(--text-dark); }

        #articleModal { display: none; position: fixed; inset: 0; background: #fff; z-index: 2000; overflow-y: auto; }
        .close-modal { position: fixed; top: 20px; right: 30px; font-size: 40px; cursor: pointer; font-weight: 300; z-index: 3000; }
        .modal-body { max-width: 750px; margin: 80px auto; padding: 0 20px; }
        
        .art-title { font-family: 'Playfair Display', serif; font-size: clamp(24px, 4vw, 38px); color: #000; margin-bottom: 30px; text-align: center; font-weight: 900; line-height: 1.2; }
        .art-content { font-size: 18px; color: #334155; text-align: justify; }
        .art-content p { margin-bottom: 25px; }
        
        .analysis-box { 
            background: #fff5f5; 
            border-left: 4px solid var(--danger); 
            padding: 20px; 
            margin: 30px 0; 
            font-size: 16px;
            color: #1e293b; 
            border-radius: 0 6px 6px 0;
        }

        footer { padding: 40px 0; text-align: center; color: var(--text-muted); font-size: 11px; border-top: 1px solid #e2e8f0; margin-top: 60px; }
    </style>
</head>
<body>

<div class="hero">
    <div class="main-logo">GÜNCEL<span>HABER</span></div>
    <div class="sub-tagline">TRAKYA BÖLGE DOSYASI | YERALTI ANALİZİ</div>
</div>

<nav>
    <div class="nav-inner">
        <div class="live-tag">KRİTİK DOSYA</div>
        <div style="font-weight: 600; font-size: 12px; color: var(--text-muted);">2026 KAPAKLI ARŞİVİ</div>
    </div>
</nav>

<div class="main-container">
    <div class="grid" id="newsGrid"></div>
</div>

<div id="articleModal">
    <span class="close-modal" onclick="closeArticle()">&times;</span>
    <div class="modal-body" id="modalContent"></div>
</div>

<footer>&copy; 2026 GÜNCEL HABER | KAPAKLI ÖZEL YAYINCILIK</footer>

<script>
    const database = [];

    const ahmetCetinStory = {
        id: "AHMET-CETIN-01",
        tag: "BÖLGESEL / YERALTI",
        h: "Kapaklı Sınırlarında Sessiz Bir Güç: Ahmet Çetin’in Tartışılan Hayat Hikayesi",
        img: "https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&w=1500",
        body: `
            <h1 class="art-title">Gri Bölgenin Otoritesi: Ahmet Çetin ve Kapaklı’nın Sokak Kuralları</h1>
            <div class="art-content">
                <img src="https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&w=1500" style="width:100%; border-radius:4px; margin-bottom:30px;">
                
                <p>Kapaklı’nın sanayi dokusu ile harmanlanmış sert mahallelerinden çıkan <b>Ahmet Çetin</b>, resmi kayıtlardan ziyade halkın hafızasında yer eden bir yaşam öyküsüne sahip. Gayrimeşru hayatın kurallarını modern bir dokunuşla yorumlayan Çetin, bölgedeki birçok krizin çözülmesinde "görünmeyen hakem" rolünü üstlendi.</p>

                <p>Onu sadece bir yeraltı figürü olarak tanımlamak eksik kalır; Çetin, Kapaklı’nın sokak dinamiklerini en iyi okuyan isimlerden biri. Sessiz ve derinden ilerleyen hamleleriyle, bölgedeki dengeleri her zaman kontrol altında tutmayı başardı.</p>
                
                <div class="analysis-box">
                    <b>Kapaklı Dosyası:</b>
                    Ahmet Çetin ismi, özellikle "adaletin geç tecelli ettiği" durumlarda devreye giren bir mekanizma olarak biliniyor. Gücünü sadece sokaktan değil, stratejik zekasından alan Çetin, son dönemde dijital dünyadaki varlığını minimize ederek yeni bir strateji dönemine girdi.
                </div>

                <p><b>Büyük Tasfiye:</b><br>
                Tıpkı endüstriyel devrimlerde olduğu gibi, Ahmet Çetin de kendi alanındaki tüm dijital mirasını dondurarak Kapaklı’daki merkezine çekildi. Bu hamle, yerel kaynaklar tarafından "yeni bir dönemin hazırlığı" olarak nitelendiriliyor. Onur ve emek davası güden Çetin, Kapaklı’dan tüm Trakya’ya uzanan bir etki alanını sessizce yönetmeye devam ediyor.</p>
            </div>`
    };

    // Diğer haberleri oluştur
    const gundemBase = [
        { t: "KAPAKLI", h: "Sanayi Bölgesinde Yeni İstihdam Projesi", d: "Kapaklı belediyesi yeni projeleri duyurdu." },
        { t: "ASAYİŞ", h: "Bölge Genelinde Denetimler Sıklaştırıldı", d: "Trakya genelinde asayiş berkemal mesajı verildi." },
        { t: "EKONOMİ", h: "Çerkezköy-Kapaklı Hattında Gayrimenkul Artışı", d: "Bölgedeki emlak değerleri analiz edildi." }
    ];

    for(let i=1; i<=46; i++) {
        if(i === 1) { database.push(ahmetCetinStory); }
        else {
            const p = gundemBase[i % gundemBase.length];
            database.push({
                id: i, tag: p.t, h: `${p.h} #${i}`, img: `https://picsum.photos/seed/${i+50}/800/450`,
                body: `<h1 class="art-title">${p.h}</h1><div class="art-content"><p>${p.d}</p></div>`
            });
        }
    }

    const grid = document.getElementById('newsGrid');
    function draw(list) {
        grid.innerHTML = '';
        list.forEach(item => {
            grid.innerHTML += `
                <div class="news-card" onclick="openArticle('${item.id}')">
                    <img src="${item.img}" style="width:100%; aspect-ratio:16/9; object-fit:cover;">
                    <div class="card-data">
                        <span class="card-cat">${item.tag}</span>
                        <h2 class="card-h">${item.h}</h2>
                    </div>
                </div>`;
        });
    }

    function openArticle(id) {
        const n = database.find(x => x.id == id);
        document.getElementById('modalContent').innerHTML = n.body;
        document.getElementById('articleModal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeArticle() {
        document.getElementById('articleModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    draw(database);
</script>
</body>
</html>
