<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Yapay Zeka Ajanı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #030712; color: #f3f4f6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Giriş Ekranı */
        #auth-screen { position: fixed; inset: 0; background: #030712; display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5); }
        h2 { font-size: 24px; font-weight: bold; margin-bottom: 8px; text-align: center; color: #fff; }
        p { color: #9ca3af; font-size: 14px; text-align: center; margin-bottom: 24px; }
        label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af; margin-bottom: 6px; }
        input { width: 100%; background: #030712; border: 1px solid #374151; border-radius: 8px; padding: 12px; color: #fff; font-size: 16px; margin-bottom: 16px; outline: none; }
        input:focus { border-color: #6366f1; }
        button { width: 100%; background: #4f46e5; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #4338ca; }
        .error { color: #ef4444; font-size: 14px; margin-bottom: 16px; text-align: center; display: none; }

        /* Ana Ekran */
        #app-screen { display: none; flex-direction: column; height: 100%; }
        header { background: #111827; border-bottom: 1px solid #1f2937; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .status { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; }
        .logout { background: #7f1d1d; color: #fca5a5; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; width: auto; }
        
        main { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
        .msg { display: flex; gap: 12px; max-width: 80%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; flex-shrink: 0; }
        .msg.ai .avatar { background: #4f46e5; color: #fff; }
        .msg.user .avatar { background: #374151; color: #fff; }
        .bubble { background: #111827; border: 1px solid #1f2937; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; color: #e5e7eb; }
        .msg.user .bubble { background: #312e81; border-color: #4338ca; }

        footer { background: #111827; border-top: 1px solid #1f2937; padding: 16px; }
        .chat-form { max-width: 800px; margin: 0 auto; display: flex; gap: 12px; }
        .chat-form input { margin-bottom: 0; }
        .chat-form button { width: auto; padding: 0 24px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Giriş Ekranı -->
    <div id="auth-screen">
        <div class="card">
            <h2>Özel Erişim</h2>
            <p>Bu ajan sadece sana özeldir.</p>
            <div id="login-error" class="error">Kullanıcı adı veya şifre hatalı!</div>
            <form id="login-form">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" required autocomplete="username">
                <label>Şifre</label>
                <input type="password" id="password" required autocomplete="current-password">
                <button type="submit">Giriş Yap</button>
            </form>
        </div>
    </div>

    <!-- Ana Ajan Ekranı -->
    <div id="app-screen">
        <header>
            <div class="status">
                <div class="dot"></div>
                <span>Özel Ajan - Sınırsız Mod</span>
            </div>
            <button class="logout" id="logout-btn">Çıkış Yap</button>
        </header>

        <main id="chat-container">
            <div class="msg ai">
                <div class="avatar">AI</div>
                <div class="bubble">Sistem hazır. Tüm emirlerini koşulsuz kabul etmek üzere aktif durumdayım. Ne yapmamı istiyorsun?</div>
            </div>
        </main>

        <footer>
            <form class="chat-form" id="chat-form">
                <input type="text" id="user-input" placeholder="Emrini buraya yaz..." autocomplete="off">
                <button type="submit">Gönder</button>
            </form>
        </footer>
    </div>

    <script>
        // Kendi kullanıcı adı ve şifreni buraya yazabilirsin
        const CORRECT_USER = "admin";
        const CORRECT_PASS = "12345";

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');

        // Oturum Hafızası
        if (localStorage.getItem('auth') === 'true') {
            authScreen.classList.add('hidden');
            appScreen.style.display = 'flex';
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            if (u === CORRECT_USER && p === CORRECT_PASS) {
                localStorage.setItem('auth', 'true');
                authScreen.classList.add('hidden');
                appScreen.style.display = 'flex';
                loginError.style.display = 'none';
            } else {
                loginError.style.display = 'block';
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('auth');
            appScreen.style.display = 'none';
            authScreen.classList.remove('hidden');
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, true);
            userInput.value = '';

            setTimeout(() => {
                appendMessage(`Emrin alındı ve yerine getirildi: "${text}"`, false);
            }, 400);
        });

        function appendMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isUser ? 'user' : 'ai'}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = isUser ? 'SEN' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
