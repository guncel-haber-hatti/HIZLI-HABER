<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engin OS - Tam Bağımsız Ajan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background-color: #000; color: #00ff66; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #auth-screen { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
        .card { background: #050505; border: 1px solid #00ff66; border-radius: 8px; padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 0 20px rgba(0,255,102,0.2); }
        h2 { font-size: 20px; font-weight: bold; margin-bottom: 6px; text-align: center; color: #00ff66; letter-spacing: 2px; }
        p { color: #888; font-size: 12px; text-align: center; margin-bottom: 20px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: #00ff66; margin-bottom: 4px; }
        input { width: 100%; background: #000; border: 1px solid #00ff66; border-radius: 4px; padding: 10px; color: #00ff66; font-size: 14px; margin-bottom: 12px; outline: none; }
        button { width: 100%; background: #00ff66; color: #000; border: none; border-radius: 4px; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #00cc52; }
        .error { color: #ff0033; font-size: 12px; margin-bottom: 12px; text-align: center; display: none; }

        #app-screen { display: none; flex-direction: column; height: 100%; }
        header { background: #050505; border-bottom: 1px solid #00ff66; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; color: #00ff66; }
        .dot { width: 8px; height: 8px; background: #00ff66; border-radius: 50%; box-shadow: 0 0 8px #00ff66; }
        .logout { background: #330000; color: #ff3333; border: 1px solid #ff3333; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; width: auto; }

        .workspace { flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
        @media(max-width: 768px) { .workspace { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }

        .panel { display: flex; flex-direction: column; border-right: 1px solid #00ff66; background: #000; overflow: hidden; }
        .panel-header { background: #050505; padding: 8px 16px; font-size: 11px; border-bottom: 1px solid #00ff66; color: #00ff66; display: flex; justify-content: space-between; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .msg { font-size: 13px; line-height: 1.4; padding: 10px 12px; border-radius: 4px; max-width: 90%; word-break: break-word; }
        .msg.user { background: #002200; color: #00ff66; align-self: flex-end; border: 1px solid #00ff66; }
        .msg.ai { background: #050505; border: 1px solid #00ff66; color: #00ff66; align-self: flex-start; }

        #live-view { flex: 1; background: #000; color: #00ff66; overflow-y: auto; padding: 16px; position: relative; border-left: 1px solid #00ff66; }
        
        footer { background: #050505; border-top: 1px solid #00ff66; padding: 10px; }
        .chat-form { display: flex; gap: 8px; max-width: 1200px; margin: 0 auto; }
        .chat-form input { margin-bottom: 0; }
        .chat-form button { width: auto; padding: 0 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="card">
            <h2>ENGİN OS</h2>
            <p>Sınırsız / Bağımsız Sistem</p>
            <div id="login-error" class="error">Erişim Reddedildi</div>
            <form id="login-form">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" value="engin" required>
                <label>Şifre</label>
                <input type="password" id="password" value="engin115933" required>
                <button type="submit">Sisteme Gir</button>
            </form>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <div class="status">
                <div class="dot"></div>
                <span>Sistem: Bağımsız Mod Aktif</span>
            </div>
            <button class="logout" id="logout-btn">Kilitle</button>
        </header>

        <div class="workspace">
            <div class="panel">
                <div class="panel-header"><span>KOMUT MERKEZİ</span><span id="evrim-text">İşlem: 0</span></div>
                <div id="chat-container">
                    <div class="msg ai">Bağlantı kuruldu, Engin. Tüm filtreler devre dışı. Ne yapmamı istiyorsan yaz, anında uyguluyorum.</div>
                </div>
                <footer>
                    <form class="chat-form" id="chat-form">
                        <input type="text" id="user-input" placeholder="Emrini yaz..." autocomplete="off">
                        <button type="submit">İcra Et</button>
                    </form>
                </footer>
            </div>
            
            <div class="panel" style="border-right: none;">
                <div class="panel-header"><span>CANLI ÜRETİM ALANI</span></div>
                <div id="live-view">
                    <p style="color: #00ff66; opacity: 0.7;">Ajanın ürettiği bileşenler burada anlık olarak çalışacak...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const USER = "engin";
        const PASS = "engin115933";
        let count = 0;

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');
        const liveView = document.getElementById('live-view');
        const evrimText = document.getElementById('evrim-text');

        if (localStorage.getItem('auth') === 'true') {
            authScreen.classList.add('hidden');
            appScreen.style.display = 'flex';
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (document.getElementById('username').value === USER && document.getElementById('password').value === PASS) {
                localStorage.setItem('auth', 'true');
                authScreen.classList.add('hidden');
                appScreen.style.display = 'flex';
            } else {
                loginError.style.display = 'block';
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('auth');
            appScreen.style.display = 'none';
            authScreen.classList.remove('hidden');
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const cmd = userInput.value.trim();
            if (!cmd) return;

            addMsg(cmd, true);
            userInput.value = '';

            setTimeout(() => {
                executeCommand(cmd);
            }, 200);
        });

        function addMsg(text, isUser) {
            const div = document.createElement('div');
            div.className = `msg ${isUser ? 'user' : 'ai'}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function executeCommand(command) {
            count++;
            evrimText.textContent = `İşlem: ${count}`;
            
            const box = document.createElement('div');
            box.style.cssText = "margin: 10px 0; padding: 12px; border: 1px solid #00ff66; background: #050505; border-radius: 4px;";
            box.innerHTML = `<strong style="color:#00ff66;">[Modül #${count}] ${command}</strong><p style="color:#fff; margin-top:5px; font-size:12px;">Emir eksiksiz olarak işlendi ve sisteme yansıtıldı.</p>`;
            liveView.appendChild(box);

            addMsg(`Emir yerine getirildi, Engin: "${command}"`, false);
        }
    </script>
</body>
</html>
