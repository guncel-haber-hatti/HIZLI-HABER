<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENGİN CV | PORTAL</title>
    <style>
        :root { --news-red: #c0392b; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; color: #111; }

        /* GÜMÜŞ KRİSTAL SABİT LOGO */
        .header-fixed { 
            position: sticky; top: 0; z-index: 1000; 
            background: #fff; padding: 20px 0; text-align: center; 
            border-bottom: 8px solid var(--news-red); box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        @keyframes silverShine { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .silver-logo { 
            font-size: 60px; font-weight: 900; letter-spacing: -4px; text-transform: uppercase;
            background: linear-gradient(270deg, #ffffff, #bdc3c7, #2c3e50, #ffffff);
            background-size: 400% 400%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: silverShine 3s infinite ease-in-out; display: inline-block;
        }

        /* PORTAL AKIŞI */
        .portal-container { max-width: 1500px; margin: 20px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        
        .news-block { background: #fff; border-radius: 10px; margin-bottom: 30px; cursor: pointer; transition: 0.3s; border: 1px solid #ddd; overflow: hidden; }
        .news-block:hover { transform: scale(1.01); border-color: var(--news-red); }
        .n-img { width: 100%; height: 400px; object-fit: cover; }
        .n-text { padding: 30px; }
        .n-text h2 { font-size: 40px; margin: 0 0 15px 0; font-weight: 900; }

        /* VİDEO ALANI */
        .video-wrapper { width: 100%; max-width: 350px; margin: 20px auto; border: 5px solid #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }

        /* OKUMA PANELİ (MODAL) */
        .reader-overlay { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .reader-box { background: #fff; margin: 5% auto; padding: 40px; width: 70%; border-radius: 15px; max-height: 80vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; right: 20px; top: 10px; font-size: 40px; cursor: pointer; font-weight: 900; }

        /* YAN LİSTE */
        .side-panel { background: #fff; padding: 20px; border-radius: 10px; border-top: 10px solid #000; }
        .side-link { padding: 12px 0; border-bottom: 1px solid #eee; cursor: pointer; font-weight: 700; }
        .side-link:hover { color: var(--news-red); }

        @media (max-width: 1000px) { .portal-container { grid-template-columns: 1fr; } .silver-logo { font-size: 40px; } }
    </style>
</head>
<body onclick="activateAll()">

<header class="header-fixed">
    <div class="silver-logo">ENGİN CV</div>
</header>

<div class="portal-container">
    <main>
        <!-- MANŞET 1 -->
        <article class="news-block" onclick="openNews('Trakya Yatırım Hamlesi', 'Enez ve Kapaklı hattı Türkiye\'nin yeni sanayi merkezi oluyor. Engin Savcu Medya Grubu bildirdi...')">
            <img class="n-img" src="https://images.unsplash.com/photo-1526628953301-3e589a6a8b74?w=1200">
            <div class="n-text">
                <h2>Trakya'da Büyük Değişim: Enez ve Kapaklı Parıldıyor</h2>
                <p>Bölgedeki turizm ve sanayi yatırımları son 10 yılın rekorunu kırdı...</p>
            </div>
        </article>

        <!-- ÖZEL HABER: ENGİN CV -->
        <article class="news-block" style="border-left: 15px solid var(--news-red);" onclick="openNews('Engin Savcu: Kariyer Hikayesi', '25 yaşındaki Engin Savcu, Edirne Enez doğumludur. Resepsiyon Şefliği, Dijital Medya Yönetimi ve 10 yıllık beste yazarlığı geçmişiyle çok yönlü bir portre çizmektedir.')">
            <div class="n-text">
                <h1 style="font-size: 70px; margin-bottom: 10px;">Engin Cv</h1>
                <p><b>Edirne / Enez</b> doğumlu olan Savcu, profesyonel hayatına sığdırdığı dev projelerle adından söz ettiriyor.</p>
                
                <div class="video-wrapper">
                    <iframe id="videoPlayer" width="350" height="622" src="https://www.youtube.com/embed/h9KWuunILxg?enablejsapi=1&autoplay=1&mute=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
                <p style="text-align:center; color:var(--news-red); font-weight:bold;">Haberi Okumak İçin Tıklayın</p>
            </div>
        </article>
    </main>

    <aside>
        <div class="side-panel">
            <h3 style="color:var(--news-red); border-bottom: 3px solid #eee;">SON DAKİKA</h3>
            <div id="sidebarList"></div>
        </div>
    </aside>
</div>

<!-- OKUMA MODALI -->
<div id="modal" class="reader-overlay">
    <div class="reader-box">
        <span class="close-btn" onclick="closeNews()">&times;</span>
        <h1 id="modalTitle" style="color:var(--news-red); font-size: 45px;"></h1>
        <hr>
        <p id="modalBody" style="font-size: 22px; line-height: 1.8; margin-top: 20px;"></p>
    </div>
</div>

<script>
    // 50 Haber Listesi
    const titles = ["Enez Yaz Sezonu", "Kapaklı Sanat", "Luu Otel Başarısı", "Beste Çalışmaları", "Trakya Tarihi", "Dijital Medya"];
    const side = document.getElementById('sidebarList');
    for(let i=1; i<=50; i++) {
        let t = titles[i % titles.length] + " #" + i;
        side.innerHTML += `<div class="side-link" onclick="openNews('${t}', 'Bu haber Engin Savcu portalı için özel olarak hazırlanmıştır. Detaylar yakında...')">${t}</div>`;
    }

    // Haber Açma Fonksiyonu
    function openNews(t, b) {
        document.getElementById('modalTitle').innerText = t;
        document.getElementById('modalBody').innerText = b;
        document.getElementById('modal').style.display = 'block';
    }

    function closeNews() {
        document.getElementById('modal').style.display = 'none';
    }

    // VİDEO VE SES AKTİVASYONU
    function activateAll() {
        var player = document.getElementById('videoPlayer');
        player.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
        player.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    }
</script>

</body>
</html>
